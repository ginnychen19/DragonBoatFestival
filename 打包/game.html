<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:url" content="gotoo.co" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="端午龍舟爭霸賽！" />
    <meta property="og:description" content="
    今天是端午節喔！一起來划龍舟吧，推薦雙人遊玩喔🎉🚣‍♂️  
    希望大家可以在這個節日裡，跟親朋好友相聚，一起慶祝🎊" />
    <meta property="og:image" content="https://gotoo.co/demo/elizabeth/04_DragonBoatFestival/assest/img/Pre_bg02.png">
    
    <link href="./dragon-boat-festival.ico" rel="shortcut icon" />
    <title>端午龍舟爭霸賽！</title>
    <link href="./css/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.js"
        integrity="sha256-a9jBBRygX1Bh5lt8GZjXDzyOB+bWve9EiO7tROUtj/E=" crossorigin="anonymous"></script>
</head>

<body>
    <div id="game">
        <Canvas id="CanvasGame">
        </Canvas>
        <div class="gameUI">
            <div id="ui-start" class="">
                <h1>🐲划龍舟</h1>
                <p>請控制龍舟的方向🚣<br>避免撞到礁石，蒐集旗子吧~</p>
                <p>可以雙人或單人遊玩~<br>希望你隊友不會太雷🤪</p>
                <table>
                    <thead>
                        <tr>
                            <td colspan="2">
                                <h3>遊玩方式</h3>
                            </td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <p>往左</p>
                            </td>
                            <td>
                                <p>A鍵、往左按鈕</p>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <p>往右</p>
                            </td>
                            <td>
                                <p>右方向鍵、往右按鈕</p>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <p>暫停</p>
                            </td>
                            <td>
                                <p>空白鍵、按鈕</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <section>
                    <button class="button type1 start">
                        <span class="btn-txt">開始遊戲</span>
                    </button>
                    <button class="button type1 music">
                        <span class="btn-txt">音樂</span>
                    </button>
                </section>
            </div>
            <div id="ui-play" class="hidden">
                <section class="up">
                    <section class="ProgressBar">
                        <input type="range" id="ProgressBar" value="0" max="60" disabled>
                    </section>
                    <section class="info">
                        <h1 class="no-select">🚩：<span class="score">0</span></h1>
                        <input type="checkbox" id="checkboxInput">
                        <label for="checkboxInput" class="toggleSwitch">
                            <div class="speaker">
                                <svg xmlns="http://www.w3.org/2000/svg" version="1.0" viewBox="0 0 75 75">
                                    <path
                                        d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z"
                                        style="stroke:#F3D1B2;stroke-width:5;stroke-linejoin:round;fill:#F3D1B2;">
                                    </path>
                                    <path
                                        d="M48,27.6a19.5,19.5 0 0 1 0,21.4M55.1,20.5a30,30 0 0 1 0,35.6M61.6,14a38.8,38.8 0 0 1 0,48.6"
                                        style="fill:none;stroke:#F3D1B2;stroke-width:5;stroke-linecap:round"></path>
                                </svg>
                            </div>
                            <div class="mute-speaker">
                                <svg version="1.0" viewBox="0 0 75 75" stroke="#F3D1B2" stroke-width="5">
                                    <path d="m39,14-17,15H6V48H22l17,15z" fill="#F3D1B2" stroke-linejoin="round"></path>
                                    <path d="m49,26 20,24m0-24-20,24" fill="#F3D1B2" stroke-linecap="round"></path>
                                </svg>
                            </div>
                        </label>
                        <button class="btn PauseGame"></button>
                    </section>
                </section>
                <section class="down">
                    <button class="play left"></button>
                    <button class="play right"></button>
                </section>
            </div>
            <div id="ui-GameOver" class="hidden">
                <div class="ui-GameOver">
                    <h1>蒐集成果</h1>
                    <h1>🚩：<span class="score">0</span></h1>
                    <h3 id="evaluate"></h3>
                </div>
                <section>
                    <button class="button type1 reStart">
                        <span class="btn-txt">重新開始</span>
                    </button>
                </section>
            </div>
        </div>
    </div>

    <img class="hidden" id="rock01" src="./assest/img/rock01.png">
    <img class="hidden" id="flag" src="./assest/img/flag.png">
    <img class="hidden" id="PlayerBoat" src="./assest/img/PlayerBoat.png">


    <script type="module" src="./js/main.js"></script>
</body>
