    <div id="game">
        <div class="talkUI">
            <h4 id="talk" class="animate__animated hidden"></h4>
        </div>
        <img class="bg" src="./DragonBoatFestival_ani.svg">
    </div>

    <script>
        const talk = $("#talk");
        var blessings = [
            "你掉的是金粽子還是銀粽子阿",
            "恭喜你已被財神關注 <br> 去買樂透吧",
            "北部粽和南部粽我都愛 <br> 甜粽冰粽也不賴",
            "記得掛艾草阿~ <br> 這個季節蚊蟲多",
            "在小小的湖裡面呀划呀划呀划 <br> 搭龍舟嗎?",
            "端午快樂~ <br> 祝你身體健康、粽氣十足",
            "端午佳節香粽飄 <br> 幸福安康繞心間",
            "蓮葉飄香聞端午 <br> 快樂滿懷迎佳節",
            "踏青遊山趣無邊 <br> 端午佳節樂淘淘",
            "祝福你的未來能無比精彩 <br> 與“粽”不同",
            "端午既要賽龍舟 <br> 也要與你，風雨同舟",
            "龍舟奮勇爭先 <br> 人生也要勇往直前",
            "“粽”星捧月 <br> 你最閃耀",
            "獨樂樂不如“粽”樂樂 <br> 快叫上朋友出去玩吧",
            "偷偷告訴你 <br> 吃鮮肉粽得小鮮肉"
        ];

        // 随机生成祝福语
        function generateRandomBlessing() {
            var randomIndex = Math.floor(Math.random() * blessings.length);
            setTimeout(() => { //延遲4秒後執行
                let counter02 = 0;
                let interval02 = setInterval(function () {
                    counter02 += 1;
                    if (counter02 <= blessings[randomIndex].length) {
                        var myWord = "";
                        for (let i = 0; i < counter02; i++) {
                            myWord += blessings[randomIndex][i];
                            if (i > counter02) { i = 0 }
                        }
                        talk.html(myWord);
                    } else {
                        clearInterval(interval02);
                    }
                }, 150)
            }, 4000);
        }

        $(document).ready(function () {
            var counter = 0; // 全局计数器
            generateRandomBlessing();
            var interval = setInterval(function () {
                counter += 1;
                // console.log(counter);
                if (counter === 4) {
                    talk.removeClass("hidden");
                    talk.removeClass("animate__rotateOutUpRight")
                    talk.addClass("animate__rotateInDownRight");
                }
                if (counter === 10) {
                    // 执行第十秒时的操作
                    talk.addClass("hidden");
                    counter = 0;
                }

            }, 1000); // 每隔1秒钟计数一次
        });
